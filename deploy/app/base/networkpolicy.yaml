apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inference-api-default-deny
  namespace: ai-inference
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: inference-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              platform.example.com/ingress-access: "true"
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
