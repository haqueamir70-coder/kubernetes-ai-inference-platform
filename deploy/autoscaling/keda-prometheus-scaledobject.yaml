# Optional alternative to HPA. Do not apply both to the same Deployment.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: inference-api
  namespace: ai-inference
spec:
  scaleTargetRef:
    name: inference-api
  minReplicaCount: 2
  maxReplicaCount: 20
  pollingInterval: 15
  cooldownPeriod: 180
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        metricName: inference_requests_per_second
        threshold: "30"
        query: sum(rate(http_requests_total{app="inference-api"}[2m]))
