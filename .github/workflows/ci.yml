name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/inference-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/inference-api/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Render Kustomize overlay
        run: kubectl kustomize deploy/app/overlays/local > /tmp/rendered.yaml
      - name: Parse rendered YAML
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import yaml
          with open("/tmp/rendered.yaml", encoding="utf-8") as stream:
              docs = [doc for doc in yaml.safe_load_all(stream) if doc]
          assert docs, "No Kubernetes objects rendered"
          print(f"Validated {len(docs)} rendered Kubernetes objects")
          from pathlib import Path
          manifest_files = [
              p for p in Path(".").rglob("*.yaml")
              if ".git" not in p.parts and ".github" not in p.parts
          ]
          for path in manifest_files:
              with path.open(encoding="utf-8") as stream:
                  list(yaml.safe_load_all(stream))
          print(f"Parsed {len(manifest_files)} repository YAML manifests")
          PY

  terraform-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Check formatting
        run: terraform fmt -check -recursive infra/terraform
