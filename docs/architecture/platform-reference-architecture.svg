<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
<title id="title">Kubernetes AI inference platform reference architecture</title>
<desc id="desc">Clients, gateway, Kubernetes inference namespace, model artifact store, autoscaling, GitOps, CI and telemetry.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#172b3d"/></linearGradient>
  <linearGradient id="blue"><stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  <linearGradient id="teal"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".25"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#9fb4c8"/></marker>
  <style>
    .h{font:700 30px Inter,Arial,sans-serif;fill:#f8fafc}.sub{font:400 14px Inter,Arial,sans-serif;fill:#a9bbcd}
    .t{font:700 17px Inter,Arial,sans-serif;fill:#f8fafc}.b{font:400 13px Inter,Arial,sans-serif;fill:#d4e1ee}
    .small{font:600 11px Inter,Arial,sans-serif;fill:#bfcede;letter-spacing:1px}
    .line{stroke:#9fb4c8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    .dash{stroke:#8196aa;stroke-width:1.7;stroke-dasharray:7 6;fill:none}
    .card{filter:url(#shadow);stroke:#5b7187;stroke-width:1.2}
  </style>
</defs>
<rect width="1400" height="860" rx="24" fill="url(#bg)"/>
<text x="64" y="62" class="h">Kubernetes AI Inference Platform</text>
<text x="64" y="90" class="sub">Reference target state · Azure landing zone example · cloud-portable workload layer</text>
<rect x="64" y="145" width="210" height="118" rx="14" fill="#24384c" class="card"/>
<text x="88" y="181" class="small">CONSUMER</text><text x="88" y="213" class="t">Clients / Apps</text><text x="88" y="238" class="b">HTTPS · API requests</text>
<rect x="345" y="145" width="245" height="118" rx="14" fill="url(#blue)" class="card"/>
<text x="369" y="181" class="small">EDGE SECURITY</text><text x="369" y="213" class="t">API Gateway / Ingress</text><text x="369" y="238" class="b">TLS · AuthN/Z · Rate limits</text>
<path d="M274 204H340" class="line"/>
<rect x="650" y="122" width="680" height="440" rx="22" fill="#162d40" stroke="#3e6d84" stroke-width="2.2"/>
<text x="682" y="158" class="small">KUBERNETES CLUSTER · INFERENCE NAMESPACE</text>
<rect x="700" y="190" width="250" height="122" rx="13" fill="#24465d" class="card"/>
<text x="724" y="225" class="small">SERVICE DISCOVERY</text><text x="724" y="257" class="t">Kubernetes Service</text><text x="724" y="282" class="b">Readiness · stable endpoint</text>
<rect x="1020" y="190" width="260" height="122" rx="13" fill="url(#teal)" class="card"/>
<text x="1044" y="225" class="small">WORKLOAD</text><text x="1044" y="257" class="t">Inference API Pods</text><text x="1044" y="282" class="b">Validation · adapter · runtime*</text>
<path d="M590 204H694" class="line"/><path d="M950 250H1014" class="line"/>
<rect x="700" y="365" width="250" height="126" rx="13" fill="#34455c" class="card"/>
<text x="724" y="400" class="small">SCALING CONTROL</text><text x="724" y="432" class="t">HPA / KEDA*</text><text x="724" y="458" class="b">CPU · queue · concurrency</text>
<rect x="1020" y="365" width="260" height="126" rx="13" fill="#34455c" class="card"/>
<text x="1044" y="400" class="small">MODEL LIFECYCLE</text><text x="1044" y="432" class="t">Model Artifact Store*</text><text x="1044" y="458" class="b">Versioned · immutable · verified</text>
<path d="M1147 312V359" class="line"/><path d="M1020 428H956" class="line"/>
<rect x="64" y="360" width="500" height="202" rx="16" fill="#1c3449" stroke="#49647c" stroke-width="1.5"/>
<text x="90" y="397" class="small">PLATFORM ENGINEERING CONTROL PLANE</text>
<rect x="90" y="420" width="205" height="106" rx="12" fill="#3d315d" class="card"/>
<text x="110" y="455" class="t">GitHub Actions</text><text x="110" y="480" class="b">Test · scan · build</text><text x="110" y="501" class="b">SBOM · provenance*</text>
<rect x="325" y="420" width="205" height="106" rx="12" fill="#3d315d" class="card"/>
<text x="345" y="455" class="t">Argo CD*</text><text x="345" y="480" class="b">GitOps sync</text><text x="345" y="501" class="b">Drift detection</text>
<path d="M295 473H319" class="line"/><path d="M427 420V335H865V318" class="dash"/>
<rect x="650" y="620" width="680" height="150" rx="18" fill="#203b50" stroke="#52768a" stroke-width="1.5"/>
<text x="682" y="657" class="small">OBSERVABILITY PLANE</text>
<rect x="690" y="680" width="245" height="62" rx="10" fill="#225a64" class="card"/>
<text x="712" y="706" class="t">OpenTelemetry*</text><text x="712" y="728" class="b">Metrics · traces · logs</text>
<rect x="1035" y="680" width="250" height="62" rx="10" fill="#225a64" class="card"/>
<text x="1057" y="706" class="t">Prometheus / Grafana*</text><text x="1057" y="728" class="b">SLOs · dashboards · alerts</text>
<path d="M935 711H1029" class="line"/><path d="M1150 562V614" class="dash"/><path d="M825 562V614" class="dash"/>
<text x="64" y="650" class="small">INFRASTRUCTURE FOUNDATION</text>
<text x="64" y="681" class="t">Terraform · Azure VNet · AKS (planned)</text>
<text x="64" y="708" class="b">Remote state · workload identity · private networking</text>
<text x="64" y="755" class="b">* Optional extension phase. Local scaffold does not deploy these services.</text>
<text x="64" y="815" class="sub">Secure defaults · measurable SLOs · immutable artifacts · reversible releases</text>
</svg>